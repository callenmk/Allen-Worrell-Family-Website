<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Website</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f5f5f5; }
    header { background: #3b4b66; color: white; padding: 1rem; text-align: center; }
    .container { max-width: 900px; margin: auto; padding: 1rem; }
    .login-box { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-top: 3rem; }
    input { width: 100%; padding: 0.7rem; margin-top: 0.5rem; border-radius: 6px; border: 1px solid #ccc; }
    button { margin-top: 1rem; padding: 0.7rem 1rem; border: none; background: #3b4b66; color: white; border-radius: 6px; cursor: pointer; width: 100%; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 2rem; }
    .gallery img { width: 100%; border-radius: 10px; }
    #mainContent { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to Our Family Website</h1>
  </header>

  <div class="container">
    <!-- Login Section -->
    <div id="loginPage" class="login-box">
      <h2>Family Login</h2>
      <input type="password" id="passwordInput" placeholder="Enter family password" />
      <button onclick="login()">Login</button>
    </div>

    <!-- Main Content After Login -->
    <div id="mainContent">
      <h2>Family Photo Gallery</h2>
      <p>Only family members can see this content.</p>

      <div class="gallery">
        <!-- Placeholder images (replace with real family photos) -->
        <img src="https://via.placeholder.com/300" alt="Family Photo" />
        <img src="https://via.placeholder.com/300" alt="Family Photo" />
        <img src="https://via.placeholder.com/300" alt="Family Photo" />
        <img src="https://via.placeholder.com/300" alt="Family Photo" />
      </div>
    </div>
  </div>

  <script>
    const FAMILY_PASSWORD = "family2025"; // Change this to your real password

    function login() {
      const entered = document.getElementById('passwordInput').value;
      if (entered === FAMILY_PASSWORD) {
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
      } else {
        alert('Incorrect password. Try again.');
      }
    }
  </script>
</body>
</html>
